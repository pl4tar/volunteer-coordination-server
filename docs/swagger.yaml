basePath: /
definitions:
  repository.Event:
    properties:
      address:
        type: string
      capacity:
        type: integer
      category_id:
        type: integer
      created_at:
        type: string
      ends_at:
        type: string
      full_description:
        type: string
      id:
        type: string
      importance:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      organizer_id:
        type: string
      participants_count:
        type: integer
      short_description:
        type: string
      starts_at:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  v1.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        minLength: 6
        type: string
    required:
    - current_password
    - new_password
    type: object
  v1.ErrorResponse:
    properties:
      details:
        type: string
      error:
        type: string
      success:
        type: boolean
    type: object
  v1.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  v1.LoginResponse:
    properties:
      message:
        type: string
      session:
        $ref: '#/definitions/v1.SessionDTO'
      user:
        $ref: '#/definitions/v1.UserResponse'
    type: object
  v1.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 6
        type: string
      phone:
        type: string
      roles:
        items:
          type: string
        type: array
    required:
    - email
    - full_name
    - password
    type: object
  v1.ReviewRequest:
    properties:
      comment:
        type: string
      rating:
        type: integer
    required:
    - comment
    - rating
    type: object
  v1.SessionDTO:
    properties:
      expires_at:
        type: string
      id:
        type: string
    type: object
  v1.SuccessOnlyResponse:
    properties:
      success:
        type: boolean
    type: object
  v1.SuccessResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  v1.UpdateUserRequest:
    properties:
      bio:
        type: string
      full_name:
        type: string
      phone:
        type: string
    type: object
  v1.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      is_blocked:
        type: boolean
      phone:
        type: string
      roles:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
host: localhost:4949
info:
  contact: {}
  description: |-
    API для системы координации волонтёров.
    Конфиг поднимается из CONFIG_PATH (например: ./config/local.yaml).
    DB: host=localhost port=5432 db=volonteer user=postgres (пароль берётся из переменных окружения).
  title: Volunteer Coordination Server API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Аутентифицирует пользователя. Токены НЕ возвращаются в теле ответа — они устанавливаются в cookies:
        - access_token (короткоживущий)
        - refresh_token (HttpOnly, долгоживущий)
      parameters:
      - description: Данные для входа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный логин (без токенов в теле)
          schema:
            $ref: '#/definitions/v1.LoginResponse'
        "400":
          description: Некорректный формат запроса
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Неверные учетные данные
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Логин
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Удаляет access_token и refresh_token cookies (устанавливает пустые
        значения с отрицательным MaxAge).
      produces:
      - application/json
      responses:
        "200":
          description: success=true
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: Выход
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      description: |-
        Обновляет access/refresh токены. refresh_token берётся из cookie (HttpOnly).
        В случае успеха сервер обновляет cookies: access_token и refresh_token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SuccessOnlyResponse'
        "401":
          description: Нет refresh_token cookie или refresh_token невалиден
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Обновление токенов
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Создает нового пользователя в системе
      parameters:
      - description: Данные для регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
  /api/v1/users:
    get:
      consumes:
      - application/json
      description: Возвращает список всех пользователей (только для администраторов)
        с пагинацией и необязательным фильтром по роли.
      parameters:
      - default: 1
        description: Номер страницы (>= 1)
        in: query
        name: page
        type: integer
      - default: 20
        description: Количество записей на странице (1..200)
        in: query
        name: limit
        type: integer
      - description: 'Фильтр по роли (например: admin, volunteer, user)'
        in: query
        name: role
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v1.UserResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить список пользователей
      tags:
      - users
  /api/v1/users/{id}:
    get:
      consumes:
      - application/json
      description: Возвращает информацию о пользователе по его идентификатору
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить пользователя по ID
      tags:
      - users
  /api/v1/users/me:
    get:
      consumes:
      - application/json
      description: Возвращает информацию о текущем аутентифицированном пользователе
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить текущего пользователя
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Обновляет информацию о текущем пользователе
      parameters:
      - description: Данные для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить данные пользователя
      tags:
      - users
  /api/v1/users/me/password:
    put:
      consumes:
      - application/json
      description: Изменяет пароль текущего пользователя
      parameters:
      - description: Данные для смены пароля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Сменить пароль
      tags:
      - users
  /events:
    get:
      consumes:
      - application/json
      description: Возвращает список доступных мероприятий с фильтрами
      parameters:
      - description: Дата/время начала (RFC3339), starts_at >= from
        in: query
        name: from
        type: string
      - description: Дата/время конца (RFC3339), starts_at <= to
        in: query
        name: to
        type: string
      - description: Город/место (поиск по address ILIKE)
        in: query
        name: city
        type: string
      - description: ID категории
        in: query
        name: category_id
        type: integer
      - description: Статус мероприятия
        enum:
        - active
        - cancelled
        - draft
        in: query
        name: status
        type: string
      - description: Поиск по title/description
        in: query
        name: q
        type: string
      - default: 1
        description: Страница
        in: query
        name: page
        type: integer
      - default: 20
        description: Лимит
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: items,total,page,limit
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Список мероприятий
      tags:
      - events
  /events/{id}:
    get:
      parameters:
      - description: Event ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repository.Event'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Детальная информация о мероприятии
      tags:
      - events
  /events/{id}/cancel:
    post:
      parameters:
      - description: Event ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отменить заявку на участие
      tags:
      - events
  /events/{id}/reviews:
    post:
      consumes:
      - application/json
      parameters:
      - description: Event ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Оценка и комментарий
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.ReviewRequest'
      produces:
      - application/json
      responses:
        "201":
          description: success
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Оставить отзыв о мероприятии
      tags:
      - events
  /events/{id}/signup:
    post:
      parameters:
      - description: Event ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Записаться на мероприятие
      tags:
      - events
  /me/history:
    get:
      parameters:
      - default: 1
        description: Страница
        in: query
        name: page
        type: integer
      - default: 20
        description: Лимит
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: items,total,page,limit
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: История участия
      tags:
      - me
  /me/notifications:
    get:
      parameters:
      - default: false
        description: Только непрочитанные
        in: query
        name: unread
        type: boolean
      - default: 50
        description: Лимит
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: items
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить уведомления
      tags:
      - me
  /me/notifications/{id}/read:
    post:
      parameters:
      - description: Notification ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отметить уведомление прочитанным
      tags:
      - me
  /me/rating:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Рейтинг волонтёра
      tags:
      - me
  /me/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Статистика активности
      tags:
      - me
schemes:
- http
securityDefinitions:
  CookieAuth:
    in: cookie
    name: access_token
    type: apiKey
swagger: "2.0"
