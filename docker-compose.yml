version: "3.9"


services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volunteer-coordination-server
    ports:
      - "4949:4949"
    environment:
      - API_PORT=4949
      - CONFIG_PATH=/app/config/config.yml
      - DB_HOST=postgres
      - DB_NAME=postgres
      - DB_PASSWORD=8967451230
      - DB_PORT=5433
      - DB_USERNAME=postgres
    depends_on:
      - postgres
    networks:
      - volunteer-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: volunteer-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=8967451230
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./iternal/storage/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - volunteer-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  split-bill-network:
    driver: bridge